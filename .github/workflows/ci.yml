name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run offline test suite
        # No network needed: TTS fixtures are committed, ffmpeg is bundled
        # by the imageio-ffmpeg wheel, and the e2e test renders a real mp4.
        run: pytest -q
